[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finvigil"
version = "0.1.0"
description = "FinVigil: Multi-agent AML & fraud investigation system over a double-entry bank ledger with guarded SQL, deterministic XGBoost scoring, human-in-the-loop checkpoints, and CI eval gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Gunnar" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "sqlglot>=23.0.0",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.2",
    "numpy>=1.26.4",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
prod = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.7",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.4",
    "mlflow>=2.12.1",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "ml", "data", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src", "."]
addopts = "-q --basetemp=/tmp/finvigil_pytest"
asyncio_default_fixture_loop_scope = "function"
