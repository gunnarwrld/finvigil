name: FinVigil CI & Evals Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-test-and-eval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,prod]"

      - name: Lint with Ruff
        run: ruff check src ml data evals tests

      - name: Type-check with Mypy
        run: mypy src ml data evals tests

      - name: Seed ledger & train XGBoost model
        run: |
          python -m data.seed_ledger
          python -m ml.train

      - name: Run Unit & Integration Tests
        run: pytest -v

      - name: Run Golden Evals Regression Gate (>= 95% Required)
        run: python -m evals.runner
